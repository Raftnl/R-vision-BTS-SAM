];

let score = 0;
let reponses = 0;

const quizContainer = document.getElementById("quizContainer");

questions.forEach((q,index)=>{

let bloc = document.createElement("div");
bloc.className = "quiz-question";

bloc.innerHTML = `<h3>${index+1}. ${q.question}</h3>`;

q.options.forEach((option,i)=>{

let btn = document.createElement("button");

btn.className = "quiz-btn";
btn.innerText = option;

btn.onclick = function(){

if(btn.disabled) return;

reponses++;

if(i === q.answer){

btn.classList.add("good");
score++;

}else{

btn.classList.add("bad");

}

bloc.querySelectorAll("button").forEach(b=>b.disabled=true);

if(reponses === questions.length){

afficherResultat();

}

};

bloc.appendChild(btn);

});

quizContainer.appendChild(bloc);

});

function afficherResultat(){

let pourcentage = Math.round((score/questions.length)*100);

let niveau = "";

if(pourcentage < 40){

niveau = "🔴 Niveau faible";

}else if(pourcentage < 70){

niveau = "🟠 Niveau moyen";

}else if(pourcentage < 90){

niveau = "🟢 Bon niveau BTS";

}else{

niveau = "🏆 Excellent niveau BTS";

}

document.getElementById("resultatQuiz").innerHTML = `
<h2>Résultat final</h2>
<p>Score : ${score} / ${questions.length}</p>
<p>Réussite : ${pourcentage}%</p>
<p>${niveau}</p>
`;

}
